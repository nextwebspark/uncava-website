# Sveltia CMS configuration. Every collection here mirrors a schema in src/lib/content-schemas.ts
# (or Starlight's docs schema); tests/cms-config.test.ts fails when the two drift apart.

backend:
  name: github
  repo: nextwebspark/uncava-website
  branch: main
  # The Sveltia CMS Authenticator (Cloudflare Worker) that completes GitHub OAuth. See README.
  base_url: https://[SVELTIA_AUTH_WORKER_HOST]

publish_mode: editorial_workflow

site_url: https://uncava.com
display_url: https://uncava.com
logo_url: /favicon.svg

media_folder: /src/assets/blog
public_folder: /src/assets/blog

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: Field notes on executive search. A post goes live when its pull request is merged.
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: blog/{{slug}}
    # Relative to the collection folder, so Astro's image() resolves the path from the post file.
    media_folder: ../../assets/blog
    public_folder: ../../assets/blog
    sortable_fields: [pubDate, title]
    summary: '{{title}} — {{pubDate}}'
    fields:
      - name: title
        label: Title
        widget: string
        hint: The headline. Up to 100 characters; under 60 reads best in search results.
        pattern: ['^.{1,100}$', 'Use between 1 and 100 characters.']
      - name: description
        label: Description
        widget: text
        hint: One or two sentences shown in search results and link previews. 50–160 characters.
        pattern: ['^[\s\S]{50,160}$', 'Use between 50 and 160 characters.']
      - name: pubDate
        label: Publish date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - name: updatedDate
        label: Last meaningful update
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        required: false
      - name: author
        label: Author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - name: tags
        label: Topics
        widget: select
        multiple: true
        min: 1
        options:
          - { label: Market mapping, value: market-mapping }
          - { label: Research craft, value: research-craft }
          - { label: Client delivery, value: client-delivery }
          - { label: Product, value: product }
      - name: cover
        label: Cover image
        widget: image
        hint: JPG, PNG or WebP, at least 1600×900 and under 500 KB. It is resized automatically.
      - name: coverAlt
        label: Cover image description
        widget: string
        hint: Describe what the image shows for people who cannot see it. Up to 200 characters.
        pattern: ['^.{1,200}$', 'Use between 1 and 200 characters.']
      - name: draft
        label: Draft
        widget: boolean
        default: false
        required: false
        hint: A draft is never built, listed, or included in the RSS feed or sitemap.
      - name: canonical
        label: Canonical URL
        widget: string
        required: false
        hint: Only if this post was first published elsewhere. Leave empty otherwise.
      - name: inUncava
        label: In Uncava aside
        widget: object
        required: false
        hint: The dark box at the end of the post that links to the docs.
        fields:
          - { name: text, label: Text, widget: string }
          - {
              name: href,
              label: Link (a path on this site,
              starting with /),
              widget: string,
              pattern: ['^/', 'Start with /'],
            }
          - { name: label, label: Link label, widget: string }
      - name: body
        label: Body
        widget: markdown
        hint: Start sections with "Heading 2". Each one appears in the post's table of contents.

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: '{{name}}'
    media_folder: ../../assets/authors
    public_folder: ../../assets/authors
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string, required: false }
      - { name: bio, label: Short bio, widget: text, required: false, hint: Up to 280 characters. }
      - {
          name: avatar,
          label: Photo,
          widget: image,
          required: false,
          hint: Square,
          at least 160×160.,
        }
      - {
          name: url,
          label: Profile URL,
          widget: string,
          required: false,
          hint: 'A full URL, e.g. https://www.linkedin.com/in/…',
        }

  - name: legal
    label: Legal pages
    label_singular: Legal page
    description: >-
      Privacy, terms and the other legal pages. Each file is one page; its title and search
      description live in the code. Only change wording counsel has approved.
    folder: src/content/legal
    extension: md
    format: frontmatter
    create: false
    delete: false
    slug: '{{slug}}'
    preview_path: '{{slug}}'
    fields:
      - name: lastUpdated
        label: Last updated
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        hint: Change this whenever the wording changes. It is shown at the top of the page.
      - name: reviewedByCounsel
        label: Approved by counsel
        widget: boolean
        default: false
        required: false
        hint: While off, the page shows a "draft pending legal review" notice.
      - name: body
        label: Body
        widget: markdown
        hint: Start sections with "Heading 2". Each one appears in the page's table of contents.

  - name: docs-getting-started
    label: 'Docs: Getting started'
    label_singular: Docs page
    folder: src/content/docs/docs/getting-started
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: docs/getting-started/{{slug}}
    fields: &docs_fields
      - { name: title, label: Title, widget: string }
      - name: description
        label: Description
        widget: text
        hint: Shown in search results. 50–160 characters.
        pattern: ['^[\s\S]{50,160}$', 'Use between 50 and 160 characters.']
      - name: sidebar
        label: Sidebar
        widget: object
        required: false
        fields:
          - {
              name: order,
              label: Position in its group,
              widget: number,
              value_type: int,
              required: false,
            }
      - name: lastUpdated
        label: Last updated
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        required: false
      - { name: body, label: Body, widget: markdown }

  - name: docs-companies
    label: 'Docs: Companies & executives'
    label_singular: Docs page
    folder: src/content/docs/docs/companies
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: docs/companies/{{slug}}
    fields: *docs_fields

  - name: docs-capture
    label: 'Docs: Capture extension'
    label_singular: Docs page
    folder: src/content/docs/docs/capture
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: docs/capture/{{slug}}
    fields: *docs_fields
