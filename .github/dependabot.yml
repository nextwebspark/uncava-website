version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      styling:
        patterns: ['tailwindcss', '@tailwindcss/*', '@fontsource/*', '@fontsource-variable/*']
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@lhci/*'
          - '@types/*'
          - 'globals'
          - 'yaml'
      everything-else:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
