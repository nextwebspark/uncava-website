version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @astrojs/check peers typescript ^5 || ^6; a major ahead of it breaks npm ci.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Types track the Node major in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      styling:
        patterns: ['tailwindcss', '@tailwindcss/*', '@fontsource/*', '@fontsource-variable/*']
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@lhci/*'
          - '@types/*'
          - 'globals'
          - 'yaml'
      everything-else:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
